# near-sdk's `unit-testing` feature pulls near-crypto -> aws-lc-rs -> aws-lc-sys, whose Windows
# build needs NASM. aws-lc-sys ships pre-assembled objects for this case; use them so
# `cargo test` works without installing NASM. Only affects host test builds, not the wasm.
[env]
AWS_LC_SYS_PREBUILT_NASM = "1"

# Same flags cargo-near passes to the wasm build (cargo-near-build/src/near/build/mod.rs:
# "-C link-arg=-s" plus an always-appended "--cfg near"). Without `--cfg near`, near-sdk 5.30
# compiles pure-Rust fallbacks instead of the on-chain host functions (its own build error says
# so), so a plain `cargo build --target wasm32-unknown-unknown --release` would not be deployable.
# Stripping: https://docs.near.org/smart-contracts/anatomy/reduce-size
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-s", "--cfg", "near"]
